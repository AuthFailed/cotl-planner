<!doctype html>
<meta charset="utf-8">
<title>Compose background</title>
<body style="margin:0;background:#222;color:#ddd;font:13px sans-serif">
<div id="log">loading…</div>
<canvas id="c" style="max-width:100%"></canvas>
<script type="module">
import { loadTextures, drawItem } from "/bg/draw.js";
const K = Math.SQRT1_2;
const P = +(new URLSearchParams(location.search).get("ppu") || 40); // output pixels per world unit
const log = t => (document.getElementById("log").textContent = t);
const dl = await (await fetch("/bg/drawlist.json")).json();
const [X0, X1, Y0, Y1] = dl.bounds;
// v of the ground spans K*Y0..K*Y1; add headroom for tall upright things at the back
const V0 = K * Y0 - 1, V1 = K * Y1 + 8;
const W = Math.ceil((X1 - X0) * P), H = Math.ceil((V1 - V0) * P);
const c = document.getElementById("c"); c.width = W; c.height = H;
const g = c.getContext("2d");
const tex = await loadTextures([...Object.values(dl.sprites).map(s => s.tex), ...dl.items.filter(i => i.fill).map(i => i.fill)], log);

const OUT = [P, 0, 0, -P, -X0 * P, V1 * P]; // (u, v) -> canvas pixels, v up
g.fillStyle = "#141012"; g.fillRect(0, 0, W, H);
let drawn = 0;
for (const it of dl.items) drawn += drawItem(g, it, dl.sprites, tex, OUT);
g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
log(`drew ${drawn}/${dl.items.length}, ${W}x${H}`);
window.composeDone = { W, H, V0, V1, X0, X1, P };
// Saves the image plus where it sits relative to the grid origin (see app.js).
window.save = async (q = .82) => {
  const blob = await new Promise(r => c.toBlob(r, "image/webp", q));
  await fetch("/bg/background.webp", { method: "PUT", body: blob });
  const [rx, ry] = dl.world;
  const meta = { ppu: P, w: W, h: H, u0: +(X0 - rx).toFixed(4), v0: +(V1 - K * ry).toFixed(4) };
  await fetch("/bg/background.json", { method: "PUT", body: JSON.stringify(meta) });
  return { bytes: blob.size, ...meta };
};
</script>
