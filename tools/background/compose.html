<!doctype html>
<meta charset="utf-8">
<title>Compose</title>
<body style="margin:0;background:#222;color:#ddd;font:13px sans-serif">
<div id="log">loading…</div>
<canvas id="c" style="max-width:100%"></canvas>
<script type="module">
const K = Math.SQRT1_2;
const P = +(new URLSearchParams(location.search).get("ppu") || 40); // output pixels per world unit
const log = t => (document.getElementById("log").textContent = t);
const dl = await (await fetch("/bg/drawlist.json")).json();
const [X0, X1, Y0, Y1] = dl.bounds;
// v of the ground spans K*Y0..K*Y1; add headroom for tall upright things at the back
const V0 = K * Y0 - 1, V1 = K * Y1 + 8;
const W = Math.ceil((X1 - X0) * P), H = Math.ceil((V1 - V0) * P);
const c = document.getElementById("c"); c.width = W; c.height = H;
const g = c.getContext("2d");

const texNames = [...new Set([...Object.values(dl.sprites).map(s => s.tex), ...dl.items.filter(i => i.fill).map(i => i.fill)])];
const tex = {};
let done = 0;
await Promise.all(texNames.map(n => new Promise(res => {
  const im = new Image();
  im.onload = () => { tex[n] = im; log(`textures ${++done}/${texNames.length}`); res(); };
  im.onerror = () => { log(`missing ${n}`); res(); };
  im.src = "/" + n.split("/").map(encodeURIComponent).join("/");
})));

const mul = (a, b) => [a[0]*b[0]+a[2]*b[1], a[1]*b[0]+a[3]*b[1], a[0]*b[2]+a[2]*b[3], a[1]*b[2]+a[3]*b[3], a[0]*b[4]+a[2]*b[5]+a[4], a[1]*b[4]+a[3]*b[5]+a[5]];
const OUT = [P, 0, 0, -P, -X0 * P, V1 * P]; // (u, v) -> canvas pixels, v up
const tintCache = new Map();
function tinted(img, sx, sy, sw, sh, col) {
  const key = `${img.src}|${sx}|${sy}|${col}`;
  if (tintCache.has(key)) return tintCache.get(key);
  const t = Object.assign(document.createElement("canvas"), { width: Math.ceil(sw), height: Math.ceil(sh) });
  const x = t.getContext("2d");
  x.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  x.globalCompositeOperation = "multiply";
  x.fillStyle = `rgb(${col.slice(0, 3).map(v => Math.round(v * 255)).join(",")})`;
  x.fillRect(0, 0, sw, sh);
  x.globalCompositeOperation = "destination-in"; // keep the original alpha
  x.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  tintCache.set(key, t);
  return t;
}

g.fillStyle = "#141012"; g.fillRect(0, 0, W, H);
let drawn = 0;
for (const it of dl.items) {
  if (it.shape) {
    // SpriteShape fill: polygon in local units, fill texture tiled at its pixels-per-unit
    const img = tex[it.fill];
    if (!img) continue;
    g.setTransform(...mul(OUT, it.aff));
    const pat = g.createPattern(img, "repeat");
    pat.setTransform(new DOMMatrix([1 / it.ppu, 0, 0, -1 / it.ppu, 0, 0]));
    g.beginPath();
    it.shape.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
    g.closePath();
    g.globalAlpha = it.c[3];
    g.fillStyle = pat;
    g.fill();
    drawn++;
    continue;
  }
  const sp = dl.sprites[it.s], img = tex[sp.tex];
  if (!img) continue;
  const [tx, ty, tw, th] = sp.tr, [rw, rh] = sp.rect, [ox, oy] = sp.off, [pvx, pvy] = sp.pivot, ppu = sp.ppu;
  if (tw < 1 || th < 1) continue;
  const sx = tx, sy = img.naturalHeight - ty - th; // texture rects are measured from the bottom
  // source pixel (px, py) -> sprite-local units (x right, y up)
  let L = [1 / ppu, 0, 0, -1 / ppu, (ox - pvx * rw) / ppu, (oy - pvy * rh + th) / ppu];
  // atlas packing rotation: 1 flip H, 2 flip V, 3 rotate 180
  if (sp.rot === 1 || sp.rot === 3) L = mul(L, [-1, 0, 0, 1, tw, 0]);
  if (sp.rot === 2 || sp.rot === 3) L = mul(L, [1, 0, 0, -1, 0, th]);
  const M = mul(OUT, mul(it.aff, L));
  g.setTransform(...M);
  g.globalAlpha = it.c[3];
  const white = it.c[0] > .99 && it.c[1] > .99 && it.c[2] > .99;
  if (white) g.drawImage(img, sx, sy, tw, th, 0, 0, tw, th);
  else g.drawImage(tinted(img, sx, sy, tw, th, it.c), 0, 0, tw, th);
  drawn++;
}
g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
log(`drew ${drawn}/${dl.items.length}, ${W}x${H}`);
window.composeDone = { W, H, V0, V1, X0, X1, P };
// Saves the image plus where it sits relative to the grid origin (see app.js drawBackground).
window.save = async (q = .82) => {
  const blob = await new Promise(r => c.toBlob(r, "image/webp", q));
  await fetch("/bg/background.webp", { method: "PUT", body: blob });
  const [rx, ry] = dl.world;
  const meta = { ppu: P, w: W, h: H, u0: +(X0 - rx).toFixed(4), v0: +(V1 - K * ry).toFixed(4) };
  await fetch("/bg/background.json", { method: "PUT", body: JSON.stringify(meta) });
  return { bytes: blob.size, ...meta };
};
</script>
