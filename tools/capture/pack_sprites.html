<!doctype html>
<meta charset="utf-8">
<title>Pack sprites</title>
<body style="margin:0;background:#333;color:#ddd;font:13px sans-serif">
<div id="log">loading…</div>
<script type="module">
// Packs the plugin's building renders (buildings/<TYPE>.png + buildings.json) into the planner's
// atlas, two sheets: sprites.png with what a first visit draws (the build menu's buildings and the
// default Temple) and sprites-2.png with the rest (upgrade levels), fetched only when needed.
// sprites.json: items[type] = [x, y, w, h, anchorX, anchorY, sheet (omitted for the first)].
// tools/capture/looks_to_data.sh encodes the sheets and copies them into public/data/looks/<look>/.
// ?scale=0.75 shrinks everything (and the anchors) to keep the atlas small; ?look=night packs the
// renders in night/buildings/ and saves night/sprites.*; ?data= is where public/data is served (game.json, base.json).
const params = new URLSearchParams(location.search);
const scale = +(params.get("scale") || 1), dir = params.get("look") ? `${params.get("look")}/` : "";
const data = params.get("data") || "data";
const log = t => (document.getElementById("log").textContent = t);
const meta = await (await fetch(`${dir}buildings/buildings.json`)).json();
const game = await (await fetch(`${data}/game.json`)).json(), base = await (await fetch(`${data}/base.json`)).json();
const first = new Set([...game.menu.flatMap(tab => tab.sections.flatMap(s => s.types)), ...(base.defaults ?? []).map(d => d.type)]);
const crops = [];
let n = 0;
await Promise.all(Object.entries(meta.items).map(([type, [ax, ay, w, h]]) => new Promise(res => {
  const im = new Image();
  im.onload = () => {
    const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    crops.push({ type, im, w: cw, h: ch, ax: ax * scale, ay: ay * scale });
    log(`loaded ${++n}`);
    res();
  };
  im.onerror = () => res();
  im.src = `${dir}buildings/${encodeURIComponent(type)}.png`;
})));

// shelf packing, tallest first, one canvas per sheet
const ATW = 4096, GAP = 2, items = {};
const sheets = [crops.filter(c => first.has(c.type)), crops.filter(c => !first.has(c.type))].map((list, i) => {
  list.sort((a, b) => b.h - a.h);
  let x = 0, y = 0, rowH = 0;
  for (const c of list) {
    if (x + c.w > ATW) { x = 0; y += rowH + GAP; rowH = 0; }
    c.x = x; c.y = y; x += c.w + GAP; rowH = Math.max(rowH, c.h);
    items[c.type] = [c.x, c.y, c.w, c.h, +c.ax.toFixed(1), +c.ay.toFixed(1), ...(i ? [i] : [])];
  }
  const atlas = document.body.appendChild(Object.assign(document.createElement("canvas"), { width: ATW, height: y + rowH }));
  atlas.style.maxWidth = "100%";
  const g = atlas.getContext("2d");
  g.imageSmoothingQuality = "high";
  for (const c of list) g.drawImage(c.im, c.x, c.y, c.w, c.h);
  return atlas;
});
const out = { ppu: meta.ppu * scale, sheets: ["sprites", "sprites-2"], items };
log(`${crops.length} buildings (${Object.values(items).filter(v => !v[6]).length} on the first sheet), sheets ${sheets.map(a => a.height).join(" + ")} px tall at ${out.ppu} px/unit`);
// lossless here; looks_to_data.sh makes the AVIF and WebP files
window.save = async () => {
  for (const [i, atlas] of sheets.entries()) {
    const blob = await new Promise(r => atlas.toBlob(r, "image/png"));
    await fetch(`/bg/${dir}${out.sheets[i]}.png`, { method: "PUT", body: blob });
  }
  await fetch(`/bg/${dir}sprites.json`, { method: "PUT", body: JSON.stringify(out) });
  return { count: crops.length, heights: sheets.map(a => a.height) };
};
</script>
